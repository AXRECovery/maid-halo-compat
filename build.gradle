tasks.register('verifyHaloModels') {
    group = 'verification'
    description = '静态校验光环模型契约：反射方法名/描述符 + 骨骼节点名'
    doLast {
        if (!haloContractProblems.isEmpty()) {
            haloContractProblems.each { println "  FAIL ${it}" }
            throw new GradleException("光环模型契约校验失败 (${haloContractProblems.size()})")
        }
        println '光环模型契约校验通过。'
    }
}

/**
 * 读取（可选的）内嵌 jar 里某个 class 的常量池字节串，逐项检查契约 token。
 * innerJarPrefix 为 null 时直接读外层 jar。
 */
List<String> checkHaloContract(String jarPath, String innerJarPrefix, String entryName, String... tokens) {
    List<String> problems = []
    File jar = project.file(jarPath)
    if (!jar.isFile()) {
        problems.add("缺少被测 jar: ${jarPath}")
        return problems
    }
    java.util.zip.ZipFile outer = new java.util.zip.ZipFile(jar)
    java.util.zip.ZipFile target = outer
    try {
        if (innerJarPrefix != null) {
            java.util.zip.ZipEntry nestedEntry = null
            for (java.util.zip.ZipEntry candidate : outer.entries()) {
                if (candidate.name.startsWith(innerJarPrefix) && candidate.name.endsWith('.jar')) {
                    nestedEntry = candidate
                    break
                }
            }
            if (nestedEntry == null) {
                problems.add("${jar.name} 中找不到内嵌 jar (${innerJarPrefix}*.jar)")
                return problems
            }
            File tmp = project.file("${project.buildDir}/tmp/" + nestedEntry.name.replaceAll('[^A-Za-z0-9._-]', '_'))
            tmp.parentFile.mkdirs()
            tmp.bytes = outer.getInputStream(nestedEntry).bytes
            target = new java.util.zip.ZipFile(tmp)
        }
        java.util.zip.ZipEntry entry = target.getEntry(entryName)
        if (entry == null) {
            problems.add("${jar.name} 中找不到 ${entryName}")
            return problems
        }
        String text = target.getInputStream(entry).getText('ISO-8859-1')
        for (String token : tokens) {
            if (!text.contains(token)) {
                problems.add("${entryName} 缺少契约成员: ${token}")
            }
        }
        if (problems.isEmpty()) {
            println "  OK   ${entryName}"
        }
    } finally {
        if (target != outer) {
            target.close()
        }
        outer.close()
    }
    return problems
}

// mods.toml / pack.mcmeta 里的 ${mod_id} 等由 Gradle expand 替换（与 scaffold 的 {{}} 不冲突）。
def replaceProperties = [
    minecraft_version: minecraft_version, forge_version: forge_version,
    minecraft_version_range: minecraft_version_range,
    forge_version_range: forge_version_range,
    loader_version_range: loader_version_range,
    mod_id: mod_id, mod_name: mod_name, mod_license: mod_license,
    mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description,
]

processResources {
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

jar {
    manifest {
        attributes([
            "Specification-Title": mod_id,
            "Implementation-Version": project.version,
        ])
    }
    finalizedBy 'reobfJar'
}
