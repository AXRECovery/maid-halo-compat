plugins {
    // 钉选 6.0.54（MDK 写 [6.0,6.2)）；版本更新时同步 versions.js 矩阵。
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
}

version = "0.2.0"
group = "com.ngly250.maidhalo"
archivesBaseName = "maid-halo-compat"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
        }
        server {
            workingDirectory project.file('run')
        }
        gameTestServer {
            workingDirectory project.file('run')
        }
        data {
            workingDirectory project.file('run')
            args '--mod', mod_id, '--all'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.3.0"

    // 只做编译期依赖，不会打进产物；运行时由整合包自带的同名模组提供。
    //（生产 jar 里模组自身的类名/方法名不混淆，因此可以直接 compileOnly 引用。）
    compileOnly files('libs/touhoulittlemaid-1.5.3.jar')
    compileOnly files('libs/curios-forge-5.14.1.jar')

    // Goety / Goety: Revelation / RevelationFix 的类一律通过反射访问（见 HaloKind / *HaloRenderer），
    // 因此不需要把动辄几十 MB 的模组本体加入编译类路径，也就不会有缺模组时 NoClassDefFoundError。
}

// ---------------------------------------------------------------- 元数据校验
// FML 要求每个 [[dependencies.*]] 块都显式写 mandatory；漏写会让整个 jar 被判定为
// InvalidModFileException（游戏里表现为模组被跳过/加载失败），所以放进 check 里拦住。
tasks.register('verifyModMetadata') {
    group = 'verification'
    description = '校验生成的 mods.toml：依赖块必须含 modId/versionRange/mandatory'
    dependsOn tasks.named('processResources')
    doLast {
        File toml = project.file("${project.buildDir}/resources/main/META-INF/mods.toml")
        if (!toml.isFile()) {
            throw new GradleException("找不到 ${toml}")
        }
        String text = toml.getText('UTF-8')
        ['modLoader', 'loaderVersion', 'license', '[[mods]]', 'modId', 'version', 'displayName'].each { key ->
            if (!text.contains(key)) {
                throw new GradleException("mods.toml 缺少必填项: ${key}")
            }
        }
        List<String> blocks = text.split(/\[\[dependencies\./).toList()
        if (blocks.size() <= 1) {
            throw new GradleException("mods.toml 没有任何 [[dependencies.*]] 块")
        }
        int index = 0
        blocks.drop(1).each { block ->
            index++
            if (!block.contains('modId')) {
                throw new GradleException("依赖块 #${index} 缺少 modId")
            }
            if (!block.contains('versionRange')) {
                throw new GradleException("依赖块 #${index} 缺少 versionRange")
            }
            if (!block.contains('mandatory')) {
                throw new GradleException("依赖块 #${index} 缺少 mandatory（FML 会判定整个 jar 无效）")
            }
        }
        if (!text.contains('modId="' + mod_id + '"')) {
            throw new GradleException("mods.toml 的 modId 不是 ${mod_id}")
        }
        println "  OK   mods.toml (${index} 个依赖块均含 modId/versionRange/mandatory)"
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyModMetadata')
}

